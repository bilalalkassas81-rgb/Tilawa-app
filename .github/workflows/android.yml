name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and copy the web app into the Android project
        run: |
          npm ci
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Tilawa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tilawa-apk
          path: Tilawa.apk

      - name: Publish as the latest download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tilawa for Android (latest build)
          make_latest: true
          files: Tilawa.apk
          body: |
            Download **Tilawa.apk** below and open it on your Android phone.
            If Android asks, allow your browser or Files app to "install unknown apps".
            Build from commit ${{ github.sha }}.
