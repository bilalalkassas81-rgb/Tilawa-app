name: Qur'an AI engine check (real model)

# Manual only: downloads the real model and runs the app in Chromium with real recitation.
on:
  workflow_dispatch:
  push:
    branches: [ccr-ac57e0d6-fjuemr]
    paths: ['www/js/**', 'tests/e2e/**', '.github/workflows/ai-diag.yml']

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app default
            models: ''
            args: ''
          - name: base q4 wasm
            models: '[{"id":"yaltaieh/whisper-base-ar-quran-onnx","device":"wasm","dtype":"q4"}]'
            args: ''
          - name: tiny q8 wasm (Sharjeelbaig)
            models: '[{"id":"Sharjeelbaig/whisper-tiny-ar-quran-onnx","device":"wasm","dtype":"q8"}]'
            args: ''
          - name: tiny int8 wasm (emadjumaah)
            models: '[{"id":"emadjumaah/mishkat-whisper-tiny-ar-quran-onnx","device":"wasm","dtype":"int8"}]'
            args: ''
          - name: webgpu swiftshader
            models: '[{"id":"yaltaieh/whisper-base-ar-quran-onnx","device":"webgpu","dtype":"q4"},{"id":"yaltaieh/whisper-base-ar-quran-onnx","device":"webgpu","dtype":{"encoder_model":"fp32","decoder_model_merged":"q4"}}]'
            args: '--enable-unsafe-webgpu --use-webgpu-adapter=swiftshader --enable-features=Vulkan --use-angle=swiftshader'
            channel: chromium
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recitation audio (EveryAyah, Al-Fatiha)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p audio
          for r in Alafasy_128kbps Husary_128kbps; do
            mkdir -p audio/$r
            for v in 1 2 3 4 5 6 7; do
              f=$(printf '001%03d' $v)
              curl -sSfL -o audio/$r/$f.mp3 https://everyayah.com/data/$r/$f.mp3
            done
            (cd audio/$r && ls *.mp3 | sed 's/^/file /' > list.txt && ffmpeg -loglevel error -y -f concat -safe 0 -i list.txt -ac 1 -ar 48000 cat.wav)
            # for the fake microphone: 3 s of silence, the seven verses, 30 s of silence
            ffmpeg -loglevel error -y -f lavfi -t 3 -i anullsrc=r=48000:cl=mono -i audio/$r/cat.wav -f lavfi -t 30 -i anullsrc=r=48000:cl=mono \
              -filter_complex '[0:a][1:a][2:a]concat=n=3:v=0:a=1' -c:a pcm_s16le audio/$r.wav
          done

      - name: Install Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Serve the app
        run: |
          nohup npx --yes http-server www -p 8080 -c-1 -s > /dev/null 2>&1 &
          sleep 5; curl -sSf -o /dev/null http://localhost:8080/ && echo serving

      - name: Alafasy
        continue-on-error: true
        env:
          MODELS: ${{ matrix.models }}
          ARGS: ${{ matrix.args }}
          CHANNEL: ${{ matrix.channel }}
        run: WAV=$PWD/audio/Alafasy_128kbps.wav SECONDS=150 node tests/e2e/ai-browser.cjs

      - name: Husary
        continue-on-error: true
        env:
          MODELS: ${{ matrix.models }}
          ARGS: ${{ matrix.args }}
          CHANNEL: ${{ matrix.channel }}
        run: WAV=$PWD/audio/Husary_128kbps.wav SECONDS=150 node tests/e2e/ai-browser.cjs
